<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thí nghiệm 3D: Điều chế ethyl acetate (phản ứng ester hoá)</title>
<style>
:root{--bg:#0d1520;--p:#13202f;--p2:#1a2b40;--ln:#27405c;--tx:#e8eef6;--mu:#92a6bd;--ac:#35c2a1;--a2:#f0a04b;--bd:#ef6a6a;--ok:#4cd08a;--lw:246px;--rw:330px}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px "Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;font-size:13px;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
/* thanh trên */
#top{position:fixed;left:0;right:0;top:0;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:rgba(10,18,28,.92);border-bottom:1px solid var(--ln);z-index:7;gap:8px}
#top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:14px}
#top .grp{display:flex;gap:6px;align-items:center;flex-shrink:0}
#top input{background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:4px 8px;width:140px;font-size:13px}
.sc{background:var(--p2);border:1px solid var(--ln);padding:2px 10px;border-radius:16px;white-space:nowrap;font-size:12.5px}.sc b{color:var(--ac)}
.tg{background:var(--p2);border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:4px 9px;font-size:12.5px;white-space:nowrap}
.tg.on{border-color:var(--ac);color:var(--ac)}.tg:hover{border-color:var(--ac)}
/* bảng hai bên */
.pn{position:fixed;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;min-height:0;z-index:5;transition:transform .25s,opacity .25s}
.ph{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 5px 10px;border-bottom:1px solid var(--ln);font-weight:700;font-size:13px;gap:6px}
.ph button{padding:1px 8px}
#lp{left:10px;top:50px;width:226px;max-height:calc(100vh - 124px)}
#rp{right:10px;top:50px;width:310px;max-height:calc(100vh - 124px)}
#lp.hid{transform:translateX(-120%);opacity:0;pointer-events:none}#rp.hid{transform:translateX(120%);opacity:0;pointer-events:none}
.hdl{position:fixed;top:56px;z-index:6;display:none;background:rgba(19,32,47,.94);border:1px solid var(--ln);color:var(--ac);padding:8px 7px;font-size:15px}
#hl{left:0;border-radius:0 10px 10px 0;border-left:0}#hr{right:0;border-radius:10px 0 0 10px;border-right:0}
.body{overflow-y:auto;padding:7px 8px;min-height:0;flex:1}
.stp{border:1px solid var(--ln);border-radius:8px;background:#101d2c;padding:5px 8px;margin-bottom:5px;display:flex;gap:7px;align-items:center;cursor:pointer;font-size:12.8px;line-height:1.3}
.stp .si{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-size:11px;flex:none;color:var(--mu)}
.stp.done .si{background:var(--ok);border-color:var(--ok);color:#04231b}.stp.cur{border-color:var(--ac)}.stp.cur .si{border-color:var(--ac);color:var(--ac)}.stp.lock{opacity:.5}.stp.view{background:#16384a}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;background:none;border:0;color:var(--mu);padding:6px 2px;border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
/* thẻ thuyết minh */
#info{position:fixed;top:50px;left:calc(var(--lw) + (100vw - var(--lw) - var(--rw))/2);transform:translateX(-50%);width:min(540px,calc(100vw - var(--lw) - var(--rw) - 24px));min-width:240px;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;z-index:5;font-size:12.8px;transition:left .25s,width .25s}
#info.hid{display:none}
#info .ih{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px}
#info .ih b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
#info .ic{padding:1px 8px}
#info .ib{padding:7px 12px 9px;max-height:28vh;overflow-y:auto;line-height:1.55;color:#c9d6e5;border-top:1px solid var(--ln)}
#info.col .ib{display:none}
.eq{margin:5px 0;padding:5px 8px;background:#08111b;border-radius:6px;font-family:Cambria,"Times New Roman",serif;font-size:13.5px;color:#ffe3a8}
.tk{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;margin-bottom:5px;background:#101d2c;font-size:12.8px}
.tk i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-style:normal;flex:none;font-size:11px}
.tk.ok{border-color:var(--ok)}.tk.ok i{background:var(--ok);border-color:var(--ok);color:#04231b}
.q{border:1px solid var(--ln);border-radius:10px;background:#101d2c;padding:8px;margin-bottom:8px}.q.okq{border-color:var(--ok)}.q.nq{border-color:var(--bd)}
.qh{font-size:11.5px;margin-bottom:3px;color:var(--ac);font-weight:700}.qt{line-height:1.45;margin-bottom:5px;font-size:13px}
.opt{display:block;width:100%;text-align:left;margin:3px 0;background:#0f1b2a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;line-height:1.35;font-size:12.8px}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:#12362a}.opt.bad{border-color:var(--bd);background:#3a1a1a}
.ex{margin-top:5px;padding:5px 8px;border-radius:7px;font-size:12.3px;line-height:1.5}.ex.g{background:#12362a;color:#bdf0d3}.ex.r{background:#3a1c1c;color:#ffc9c9}
.tfi{border:1px solid var(--ln);border-radius:8px;padding:6px 8px;margin:5px 0;background:#0f1b2a}.tfi.ok{border-color:var(--ok)}.tfi.bad{border-color:var(--bd)}
.tft{line-height:1.4;margin-bottom:5px;font-size:12.8px}.tfb{display:flex;gap:6px}.tfb button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:3px 14px}
.tfb button.sel{background:var(--ac);color:#03241b;border-color:var(--ac);font-weight:700}.tfb button:disabled{cursor:default}
.tfc{margin-top:6px}.qh .ty{color:var(--mu);font-weight:400;margin-left:6px}
.btn{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 11px}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#03241b;font-weight:700}.btn.warn{border-color:var(--a2);color:var(--a2)}.btn.on{border-color:var(--ac);color:var(--ac)}
#ctrl{position:fixed;left:10px;right:10px;bottom:10px;min-height:46px;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:5}
#ctrl .sp{flex:1}
#eqb{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);display:none;background:rgba(10,18,28,.94);border:1px solid var(--a2);border-radius:10px;padding:5px 14px;font-family:Cambria,"Times New Roman",serif;font-size:14px;color:#ffe3a8;z-index:5;text-align:center;line-height:1.55}
#toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#0a121c;border:1px solid var(--a2);color:#ffe3a8;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:13px;z-index:9}
#nogl{position:fixed;left:20%;right:20%;top:45%;text-align:center;color:var(--a2);padding:12px;background:#0a121c;border:1px solid var(--ln);border-radius:10px;z-index:4}
.rs input{background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:6px 9px;width:100%;margin:4px 0 8px}
.hi{border:1px solid var(--ln);border-radius:8px;padding:5px 8px;margin:5px 0;font-size:12.3px;background:#0f1b2a}
pre{white-space:pre-wrap;background:#08111b;padding:8px;border-radius:8px;font-size:12.3px;margin:6px 0}
@media(max-width:900px){#top input{width:100px}#top .ttl{display:none}#top{justify-content:flex-end}}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="top"><div class="ttl">Thí nghiệm 3D: Điều chế ethyl acetate (phản ứng ester hoá)</div>
<div class="grp"><input id="stu" placeholder="Họ tên học sinh" maxlength="40">
<span class="sc" id="ckw" style="display:none">Đun: <b id="ck">0</b> phút</span><span class="sc" id="mc" style="display:none"></span><span class="sc">Điểm <b id="sc">0</b>/<span id="mx">16</span></span>
<button class="tg on" id="tgl" title="Ẩn/hiện bảng các bước">☰ Các bước</button><button class="tg on" id="tgi" title="Ẩn/hiện thuyết minh">ⓘ Thuyết minh</button><button class="tg on" id="tgr" title="Ẩn/hiện bảng học tập">📚 Học tập</button><button class="tg" id="tga" title="Ẩn hoặc khôi phục toàn bộ bảng">⛶ Toàn cảnh</button></div></div>
<div id="lp" class="pn"><div class="ph"><span>Các bước</span><button class="btn" id="tl" title="Ẩn bảng">✕</button></div><div class="body" id="stl"></div></div>
<div id="rp" class="pn"><div class="ph"><span>Học tập</span><button class="btn" id="tr" title="Ẩn bảng">✕</button></div>
<div class="tabs"><button data-t="tk" class="on">Nhiệm vụ</button><button data-t="qz">Câu hỏi</button><button data-t="rs">Kết quả</button></div>
<div class="body" id="rb"></div></div>
<div id="info"><div class="ih"><b id="it"></b><button class="btn ic" id="ic" title="Thu gọn / mở rộng">▾</button><button class="btn ic" id="ix" title="Ẩn thuyết minh">✕</button></div><div class="ib" id="ibd"></div></div>
<button class="hdl" id="hl" title="Hiện bảng các bước">☰</button><button class="hdl" id="hr" title="Hiện bảng học tập">📚</button>
<div id="eqb"></div>
<div id="ctrl"></div>
<div id="toast"></div><div id="nogl" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const fp=n=>String(Math.round(n*100)/100).replace('.',',');
const KEY='ddhoa-este-v1',HKEY='ddhoa-este-hist',UKEY='ddhoa-este-ui';
let HAS3D=false,booted=false,tm=0,tab='tk',showL=true;

const STEPS=[
{t:'Chuẩn bị',d:'<b>Mục đích:</b> điều chế ester từ axit cacboxylic và ancol bằng phản ứng ester hoá (xúc tác H₂SO₄ đặc); nhận biết ester qua mùi thơm và tính ít tan, nổi trên mặt nước; hiểu vai trò của H₂SO₄ đặc, của đun nóng và của dung dịch NaCl bão hoà.<br><b>Dụng cụ:</b> ống nghiệm, cốc thuỷ tinh chịu nhiệt làm nồi cách thuỷ, đèn cồn, kiềng và lưới, kẹp ống nghiệm, giá ống nghiệm, ống hút nhỏ giọt, nhiệt kế.<br><b>Hoá chất:</b> ethanol khoảng 1 mL; axit axetic nguyên chất khoảng 1 mL; H₂SO₄ đặc 2–3 giọt; NaCl bão hoà khoảng 2 mL; nước nóng 65–70 °C và nước lạnh.<br><b>An toàn:</b> đeo kính, găng tay, khẩu trang; H₂SO₄ đặc và axit axetic đặc ăn da; ethanol, ethyl acetate rất dễ cháy.',btn:'Đã chuẩn bị, đeo bảo hộ'},
{t:'Cho ethanol và axit axetic vào ống',d:'Dùng ống hút lấy 1 mL ethanol cho vào ống nghiệm khô, sạch; thêm 1 mL axit axetic nguyên chất, lắc nhẹ cho hai chất trộn đều. Hiện tượng: hỗn hợp trong suốt, không màu, chưa có mùi thơm.',btn:''},
{t:'Thêm xúc tác H₂SO₄ đặc',d:'Nhỏ từ từ 2–3 giọt H₂SO₄ đặc vào ống, dọc theo thành ống, lắc nhẹ. Lưu ý: không đổ ngược, không nhỏ nhiều; ống hơi nóng lên do axit đặc hoà tan.',btn:''},
{t:'Đun cách thuỷ',d:'Đặt ống vào cốc nước nóng 65–70 °C, kẹp ống để đáy ngập trong nước, đun khoảng 5–6 phút; miệng ống hướng ra xa người. Không đun trực tiếp ống trên ngọn lửa vì ethanol rất dễ cháy. Hiện tượng: hỗn hợp vẫn trong suốt, bắt đầu thoảng mùi thơm nhẹ của ester (mô phỏng rút ngắn 6 phút thành khoảng 12 giây).<div class="eq">CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O (H₂SO₄ đặc, t°)</div>',btn:'Đun cách thuỷ (65–70 °C)'},
{t:'Làm nguội',d:'Lấy ống ra khỏi nồi nước, để nguội tự nhiên hoặc ngâm vào cốc nước lạnh khoảng 1–2 phút (mô phỏng rút ngắn).',btn:'Làm nguội trong nước lạnh'},
{t:'Tách ester bằng NaCl bão hoà',d:'Rót khoảng 2 mL dung dịch NaCl bão hoà vào ống, lắc nhẹ rồi để yên. Hiện tượng: hỗn hợp tách thành hai lớp; lớp mỏng không màu nổi bên trên là ethyl acetate, có mùi thơm dễ chịu; lớp nước ở phía dưới. NaCl làm tăng độ phân cực của lớp nước và giảm độ tan của ester nên tách lớp rõ hơn.',btn:''},
{t:'Nhận biết mùi (an toàn)',d:'Dùng tay phẩy nhẹ hơi từ miệng ống về phía mũi để ngửi, tuyệt đối không ghé mũi sát miệng ống vì hơi axit, ancol và ester có thể gây khó chịu.',btn:'Phẩy hơi về phía mũi'},
{t:'Cơ chế ở mức phân tử (mô hình)',d:'Camera chuyển sang cảnh phân tử. Nhóm –OH của axit axetic và nguyên tử H của –OH trong ethanol tách ra, kết hợp thành H₂O; phần còn lại (CH₃CO– và –OC₂H₅) nối với nhau bằng liên kết ester C(=O)–O–C. Dùng nút chạy, dừng, đổi chiều thuận/nghịch (thuỷ phân) và về đầu. Mô hình chỉ đơn giản hoá, không đúng tỉ lệ độ dài và góc liên kết, không thể hiện xúc tác.<div class="eq">CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O</div>',btn:'Xem mô hình phân tử'},
{t:'Giải thích và kết luận',d:'<b>H₂SO₄ đặc:</b> xúc tác và hút nước nên chuyển dịch cân bằng về phía tạo ester. <b>Đun cách thuỷ:</b> tăng tốc độ phản ứng, giữ 65–70 °C dưới nhiệt độ sôi của ester (khoảng 77 °C) để ester không bay hơi hết. <b>Axit và ancol nguyên chất:</b> ít nước, tăng hiệu suất. <b>NaCl bão hoà:</b> giảm độ tan của ester, tách lớp rõ. <b>Ester nổi:</b> khối lượng riêng khoảng 0,9 g/mL, nhẹ hơn nước và ít tan.<br><b>Kết luận:</b> axit axetic phản ứng với ethanol khi có H₂SO₄ đặc và đun nóng tạo ethyl acetate: chất lỏng nhẹ hơn nước, ít tan, mùi thơm đặc trưng.<br><b>Mở rộng (không mô phỏng):</b> thay ethanol bằng ancol isoamylic (3-metylbutan-1-ol) sẽ được isoamyl acetate, mùi chuối chín; thêm bước rửa bằng NaHCO₃ loãng để loại axit dư.<br><b>Lỗi thường gặp:</b> không thấy hai lớp do ester ít hoặc chưa thêm NaCl; mùi hắc do dư axit axetic hoặc nhỏ quá nhiều H₂SO₄; mất ester do đun quá nóng.',btn:'Hoàn thành thí nghiệm'}
];
const TASKS=[
 {t:'Cho ethanol và axit axetic vào ống (trong suốt, chưa mùi)',k:'a'},
 {t:'Nhỏ đủ 2 giọt H₂SO₄ đặc',k:'b'},
 {t:'Đun cách thuỷ đủ 6 phút ở 65–70 °C',k:'c'},
 {t:'Làm nguội ống trong nước lạnh',k:'d'},
 {t:'Quan sát hai lớp, ester nổi bên trên',k:'e'},
 {t:'Ngửi mùi an toàn (phẩy hơi)',k:'f'},
 {t:'Chạy mô hình phân tử đến hết phản ứng',k:'g'},
 {t:'Hoàn thành giải thích và kết luận',k:'h'}
];
const QZ=[
 {t:'mc',q:'Phản ứng ester hoá là phản ứng giữa:',o:['Axit cacboxylic và ancol, có xúc tác H₂SO₄ đặc.','Axit cacboxylic và bazơ.','Hai phân tử ancol với nhau.','Ancol và kim loại kiềm.'],a:0,x:'Ester hoá: axit cacboxylic + ancol ⇌ ester + nước, xúc tác H₂SO₄ đặc, đun nóng.'},
 {t:'mc',q:'Phương trình điều chế ethyl acetate là:',o:['CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O','CH₃COOH + C₂H₅OH → CH₃COOC₂H₅ + H₂ ↑','CH₃COOH + C₂H₅OH → CH₃COC₂H₅ + H₂O','CH₃COOH + C₂H₅OH → C₂H₅COOCH₃ + H₂O'],a:0,x:'Phản ứng thuận nghịch, sản phẩm gồm ethyl acetate và nước.'},
 {t:'mc',q:'Vai trò của H₂SO₄ đặc trong thí nghiệm là:',o:['Chỉ làm chất oxi hoá.','Xúc tác và hút nước, làm cân bằng chuyển dịch về phía tạo ester.','Chỉ làm dung môi hoà tan ester.','Tạo muối với ethanol.'],a:1,x:'H₂SO₄ đặc vừa xúc tác vừa hút nước nên tăng hiệu suất tạo ester.'},

function bondM(a,b,color,rad){const d=b.clone().sub(a),len=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,8),M(color,{roughness:.5}));

// ---- mô hình phân tử ester hoá (đơn giản hoá) ----
// Axit axetic (trái): CH3–C(=O)–O–H ; Ethanol (phải): H–O–CH2–CH3
// Tách: –OH của axit (O_a + H_a) và H của –OH ancol (H_e) tạo nước; còn lại nối C(=O)–O–CH2CH3.
const CCOL={C:0x8a8f95,O:0xe04040,H:0xf5f5f5},MOL={atoms:[],bonds:[],group:null,water:null,pairs:null};
function buildMol(){
 const g=new THREE.Group(),V=(x,y,z)=>new THREE.Vector3(x,y,z);MOL.atoms=[];MOL.bonds=[];
 const mkA=(el,r,x,y,z,tag)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),M(CCOL[el],{roughness:.4,metalness:.1}));m.position.set(x,y,z);g.add(m);const a={m,el,tag,p0:V(x,y,z),p1:V(x,y,z)};MOL.atoms.push(a);return a;};
 // Axit axetic (đầu bên trái), nằm ngang theo trục x
 const c3=mkA('C',.3,-4.2,-.3,0,'ac_c3'),c1=mkA('C',.3,-2.9,.2,0,'ac_c1'),od=mkA('O',.3,-2.5,1.4,0,'ac_od'),oa=mkA('O',.3,-1.9,-.6,0,'ac_oh'),ha=mkA('H',.18,-1.0,-.4,.3,'ac_h');
 const h31=mkA('H',.16,-4.7,-1.3,0,'ac_h31'),h32=mkA('H',.16,-4.9,.4,.8,'ac_h32'),h33=mkA('H',.16,-4.9,.4,-.8,'ac_h33');
 // Ethanol (đầu bên phải)
 const oe=mkA('O',.3,2.6,.4,0,'et_o'),he=mkA('H',.18,1.7,.2,.4,'et_h'),c2=mkA('C',.3,3.9,.0,0,'et_c2'),c4=mkA('C',.3,5.2,.6,0,'et_c4');
 const h21=mkA('H',.16,3.9,-.7,.9,'et_h21'),h22=mkA('H',.16,3.9,-.7,-.9,'et_h22');
 const h41=mkA('H',.16,5.2,1.7,0,'et_h41'),h42=mkA('H',.16,6.1,.3,.8,'et_h42'),h43=mkA('H',.16,6.1,.3,-.8,'et_h43');
 const dbl=mkA('H',.0001,-2.5,1.4,0,'dummy');dbl.m.visible=false;
 const bd=(a,b,color,rad,dbo)=>{const d={a,b,color,rad,m:null,dbo};MOL.bonds.push(d);};
 bd(c3,c1,0x8a8f95,.07);bd(c1,od,0xcc3333,.07);bd(c1,oa,0x8a8f95,.07);bd(oa,ha,0xffffff,.045);bd(c3,h31,0xffffff,.045);bd(c3,h32,0xffffff,.045);bd(c3,h33,0xffffff,.045);
 bd(oe,he,0xffffff,.045);bd(oe,c2,0x8a8f95,.07);bd(c2,c4,0x8a8f95,.07);bd(c2,h21,0xffffff,.045);bd(c2,h22,0xffffff,.045);bd(c4,h41,0xffffff,.045);bd(c4,h42,0xffffff,.045);bd(c4,h43,0xffffff,.045);
 // nối mới (liên kết ester) – chỉ hiện khi phản ứng
 const newB={a:c1,b:oe,color:0xffd04a,rad:.09,m:null,isNew:true};MOL.bonds.push(newB);MOL.newB=newB;
 // nước (O_a, H_a, H_e) – hiện khi phản ứng
 const wb1={a:oa,b:ha,color:0xffffff,rad:.045,m:null,isW:true},wb2={a:oa,b:he,color:0xffffff,rad:.045,m:null,isW:true};MOL.wb=[wb1,wb2];
 MOL.bonds.push(wb1,wb2);MOL.atoms.forEach(a=>{a.p1=a.p0.clone();});
 // vị trí kết thúc: ester ghép lại ở giữa; nước bị đẩy xuống dưới và ra xa
 const sh=(a,dx,dy,dz)=>{a.p1.set(a.p0.x+dx,a.p0.y+dy,a.p0.z+dz);};
 [c3,c1,od,h31,h32,h33].forEach(a=>sh(a,1.7,.0,0));       // phần axit dịch sang phải
 [oe,c2,c4,h21,h22,h41,h42,h43].forEach(a=>sh(a,-.6,.0,0)); // ancol dịch sang trái
 sh(oa,2.3,-2.6,.5);sh(ha,2.9,-2.9,.9);sh(he,2.3,-3.3,.1);      // nước đi xuống dưới
 // tạo mesh liên kết
 MOL.bonds.forEach(b=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(b.rad,b.rad,1,8),M(b.color,{roughness:.5}));g.add(m);b.m=m;});
 MOL.group=g;
 g.userData.labs=[lab(g,'Axit axetic\nCH₃COOH',-3.0,2.9,0,'#ffd27a',.0044),lab(g,'Ethanol\nC₂H₅OH',3.8,2.2,0,'#9fd0ff',.0044),
  lab(g,'Ethyl acetate\nCH₃COOC₂H₅',1.0,3.0,0,'#9ae6b4',.0044),lab(g,'Nước\nH₂O',1.6,-3.6,.5,'#6ec6ff',.0044),lab(g,'Liên kết ester\nC(=O)–O–C',.7,-1.2,1.3,'#ffd04a',.0040)];
 return g;}
const RXQ=u=>clamp(u,0,1);
function updMolRx(){
 const u=ease(RXQ(ST.rx)),g=MOL.group,lb=g.userData.labs;
 // 0–.25 các phân tử lại gần; .25–.6 tách H2O; .6–1 hình thành ester, nước rời đi. Đơn giản: nội suy tuyến tính theo u.
 MOL.atoms.forEach(a=>{a.m.position.lerpVectors(a.p0,a.p1,u);});
 const wOn=u>.02;
 MOL.bonds.forEach(b=>{
  let vis=true;
  if(b.isNew)vis=u>.6;
  else if(b.isW)vis=u>.02;
  // liên kết –OH của axit và H của ancol bị bẻ gãy khi u>.02
  else if((b.a.tag==='ac_c1'&&b.b.tag==='ac_oh')||(b.a.tag==='ac_oh'&&b.b.tag==='ac_h')||(b.a.tag==='et_o'&&b.b.tag==='et_h'))vis=u<=.02;
  if(b.a.tag==='dummy'||b.b.tag==='dummy')vis=false;
  if((b.a.el==='H'||b.b.el==='H')&&!ST.showH)vis=false;
  b.m.visible=vis;
  if(vis){const A=b.a.m.position,B=b.b.m.position,d=B.clone().sub(A),len=Math.max(.001,d.length());b.m.position.copy(A.clone().add(B).multiplyScalar(.5));b.m.scale.set(1,len,1);b.m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());}});
 MOL.atoms.forEach(a=>{if(a.tag==='dummy')a.m.visible=false;else if(a.el==='H')a.m.visible=ST.showH||a.tag==='ac_h'||a.tag==='et_h';});
 // nhãn: chất ban đầu hiện khi u thấp; ester + nước hiện khi u cao
 lb[0].visible=showL&&u<.5;lb[1].visible=showL&&u<.5;lb[2].visible=showL&&u>.85;lb[3].visible=showL&&u>.85;lb[4].visible=showL&&u>.85;
}

const HOME=[-3.2,5.8,2.4];

const RACK=[RX,TBY,0],BATHP=[BATH.x-.1,2.95,0.0],COLDP=[BATH.x+.1,.55,-2.4];
const tw=(k,to,dur,cb)=>{ST.tw[k]={from:ST[k],to,t:0,dur,cb};};
function stepTw(dt){for(const k in ST.tw){const o=ST.tw[k];o.t+=dt;const u=clamp(o.t/o.dur,0,1);ST[k]=lerp(o.from,o.to,u);if(u>=1){const cb=o.cb;delete ST.tw[k];if(cb)cb();}}}
const busy=()=>!!ST.anim||!!ST.drop||Object.keys(ST.tw).length>0||!!ST.job;
const totVol=()=>ST.E+ST.A+.03*ST.D+ST.N;
const lvl=()=>Math.min(3.2,.45*totVol());
const surfY=()=>TBY+TR+lvl();
const lp=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
function startPip(b,tgt,dur,mode,onPour,cb){ST.anim={b,tgt,u:0,dur,poured:false,mode,onPour,cb};}
function updPip(dt){
 const A=ST.anim;pipG.visible=true;let pos=HOME,fill=0,pouring=false;
 if(A){A.u=Math.min(1,A.u+dt/A.dur);const u=A.u,x=BX[A.b],T=A.tgt;
  const above=[x,3.9,BZ],dip=[x,1.55,BZ],over=[T.x,T.y,T.z];
  if(u<.14)pos=lp(HOME,above,ease(u/.14));
  else if(u<.30){pos=lp(above,dip,ease((u-.14)/.16));fill=clamp((u-.2)/.1,0,1)*1.2;}
  else if(u<.42){pos=lp(dip,above,ease((u-.30)/.12));fill=1.2;}
  else if(u<.62){pos=lp(above,over,ease((u-.42)/.2));fill=1.2;}
  else if(u<.86){pos=over;pouring=true;const f=(u-.62)/.24;fill=1.2*(1-f*(A.mode==='drop'?.12:1));
   if(!A.poured){A.poured=true;A.onPour&&A.onPour();}}
  else{pos=lp(over,HOME,ease((u-.86)/.14));fill=A.mode==='drop'?1.05:0;}
  pipLM.color.setHex(BCOL[A.b]);pipLM.opacity=.85;
  if(u>=1){const cb=A.cb;ST.anim=null;if(cb)cb();}
 }
 pipG.position.set(pos[0],pos[1],pos[2]);pipL.scale.y=Math.max(.01,fill);
 if(ST.drop){const D=ST.drop;D.t+=dt/.55;const t=clamp(D.t,0,1);dropS.visible=true;dropS.material.color.setHex(D.col);dropS.position.set(D.x,lerp(D.y0,D.ly(),t*t),D.z);
  if(D.t>=1){ST.drop=null;dropS.visible=false;D.land&&D.land();}}
 else if(pouring&&A&&A.mode==='flow'){const T=A.tgt;dropS.visible=true;dropS.material.color.setHex(BCOL[A.b]);dropS.position.set(T.x,lerp(T.y-.35,T.ly(),(tm*3.2)%1),T.z);}
 else dropS.visible=false;
}

 const jit=sh;tubeG.position.set(b[0]+Math.sin(tm*43)*.045*jit,b[1],b[2]);tubeG.rotation.z=Math.sin(tm*37)*.03*jit;tubeG.rotation.x=-.28*Math.max(e*(1-c),0);

 CT.copy(C_CLEAR).lerp(C_SALT,clamp(ST.N/2,0,1));liq.color.copy(CT);liq.opacity=.2+.1*clamp(ST.N/2,0,1)+.18*clamp(ST.turb,0,1);

 for(let i=0;i<F.length;i++){const a=F[i],s=tb>0&&has?tb*(.4+a.ys):0;
  dummy.position.set(Math.cos(a.th+tm*agi)*a.r,Math.min(top,.2+a.ys*(top-.3)+Math.sin(a.ph+tm*(1+agi*2))*.1),Math.sin(a.th+tm*agi)*a.r);dummy.rotation.set(0,0,0);dummy.scale.setScalar(Math.max(1e-4,s));dummy.updateMatrix();FL.setMatrixAt(i,dummy.matrix);}

 const th=macro.userData.therm,ts=Math.max(.05,(ST.bath-20)/80*3.2);thermH.scale.y=ts;thermH.position.y=.1+ts/2;
 const tr=Math.round(ST.bath);if(tr!==ST._tr){ST._tr=tr;relab(thermLab,tr+' °C',tr>=65&&tr<=70?'#9ae6b4':'#ff8a8a');}
 const f=clamp(ST.flame,0,1);flameG.visible=f>.02;flameG.scale.set(f*(1+.08*Math.sin(tm*13)),f*(1+.18*Math.sin(tm*17)+.08*Math.sin(tm*31)),f);flameLg.intensity=f*(1.2+.3*Math.sin(tm*20));

 else{handG.visible=false;fume.visible=false;}
}

function setTask(k){if(!ST.tk[k]){ST.tk[k]=true;save();renderRight();}}

const r0=x=>Math.round(x);
function nextAct(){const i=ST.step;
 if(i===0)return{label:STEPS[0].btn,fn:()=>mark(0)};

 if(i===2)return{label:'Nhỏ 1 giọt H₂SO₄ đặc',fn:actH2SO4};
 if(i===3)return{label:STEPS[3].btn,fn:actHeat};
 if(i===4)return{label:STEPS[4].btn,fn:actCool};
 if(i===5){if(ST.N<1.99)return{label:'Rót 2 mL NaCl bão hoà',fn:actNaCl};return{label:'Lắc nhẹ rồi để yên',fn:actSep};}
 if(i===6)return{label:STEPS[6].btn,fn:actSmell};
 if(i===7)return{label:STEPS[7].btn,fn:()=>{ST.mol=true;mark(7);ST.view=7;setView(1);ST.rx=0;ST.rxPlay=false;ST.rxDir=1;renderLeft();renderCtrl();ST.msg='Bấm “Chạy phản ứng” để xem axit và ancol kết hợp thành ester và nước.';}};

 return null;}
function actEtOH(){ST.msg='Cho 1 mL ethanol vào ống nghiệm khô, sạch.';pourFlow(0,()=>{tw('E',1,1.6,null);},()=>{ST.msg='Ống có 1 mL ethanol. Thêm axit axetic.';renderCtrl();});}
function actAcid(){ST.msg='Thêm 1 mL axit axetic nguyên chất, lắc nhẹ.';pourFlow(1,()=>{tw('A',1,1.6,null);},()=>{ST.msg='Hỗn hợp trong suốt, không màu, chưa có mùi thơm.';setTask('a');mark(1);});}
function actH2SO4(){pourDrop(2,()=>{ST.D++;ST.float=1;ST.eq='CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O (H₂SO₄ đặc, t°)';ST.msg=ST.D<2?'Giọt H₂SO₄ đặc rơi dọc thành ống; ống hơi nóng lên. Nhỏ thêm 1 giọt.':'Đã nhỏ 2 giọt H₂SO₄ đặc (rất ít). Sang bước đun cách thuỷ.';
  if(ST.D>=2){setTask('b');mark(2);}},()=>{renderCtrl();});}

  tw('hT',6,12,()=>{ST.hold=false;ST.msg='Hỗn hợp vẫn trong suốt, bắt đầu thoảng mùi thơm nhẹ của ester.';setTask('c');tw('flame',0,.8,()=>{ST.job=0;mark(3);});});});});});}
function actCool(){ST.msg='Lấy ống ra, ngâm vào cốc nước lạnh.';ST.job=1;

function actSep(){ST.job=1;ST.msg='Lắc nhẹ rồi để yên: hỗn hợp tách thành hai lớp.';ST.shake=1;ST.turb=1;ST.float=1;
 tw('shake',0,1.4,()=>{tw('sep',1,3.2,()=>{tw('turb',0,1.2,()=>{ST.msg='Hai lớp: lớp mỏng không màu nổi bên trên là ethyl acetate (mùi thơm); lớp nước muối ở dưới.';setTask('e');ST.job=0;mark(5);});});});}
function actSmell(){ST.job=1;ST.msg='Dùng tay phẩy nhẹ hơi từ miệng ống về phía mũi, không ghé sát miệng ống.';ST.smell=.001;tw('smell',1,3,()=>{ST.smell=0;ST.msg='Có mùi thơm dễ chịu của ethyl acetate.';setTask('f');ST.job=0;mark(6);});}
function shakeTube(){if(ST.anim||ST.drop||ST.job||ST.tp>.05||totVol()<.02||ST.step<1||ST.step>5)return;ST.shake=1;tw('shake',0,1.6,null);ST.float=1;if(ST.N>.5&&ST.sep<.5)ST.turb=1;ST.msg='Lắc nhẹ ống nghiệm.';}
function setView(k){Object.assign(tg,{th:VIEWS[k].th,ph:VIEWS[k].ph,r:VIEWS[k].r,tx:VIEWS[k].t[0],ty:VIEWS[k].t[1],tz:VIEWS[k].t[2]});VK=k;}
function resetExp(){const keep={tk:ST.tk,stu:ST.stu};ST=newST(keep);ST.hold=false;ST.job=0;ST._tr=-1;setView(0);renderLeft();renderCtrl();renderRight();}

let toastT=0;
function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>{e.style.opacity=0;},3000);}
function renderLeft(){
 $('stl').innerHTML=STEPS.map((s,i)=>{const lock=i>ST.step,cur=i===ST.step&&!ST.done[i];return`<div class="stp${ST.done[i]?' done':''}${cur?' cur':''}${lock?' lock':''}${ST.view===i?' view':''}" data-i="${i}"><span class="si">${ST.done[i]?'✓':i+1}</span><span>${s.t}</span></div>`;}).join('');
 const v=ST.view;$('it').textContent='Bước '+(v+1)+': '+STEPS[v].t;$('ibd').innerHTML=STEPS[v].d;}
function goView(i){if(i>ST.step||busy())return;ST.view=i;const m=(i===7);ST.mol=m;setView(m?1:0);renderLeft();renderCtrl();}
function renderCtrl(){const c=$('ctrl'),b=[],bz=busy()?'disabled':'';
 if(!ST.mol){
  const act=nextAct();
  if(act)b.push(`<button class="btn pri" id="bgo" ${bz}>${act.label}</button>`);
  if(ST.step===2)b.push(`<span class="sc">H₂SO₄ đặc: <b>${ST.D}</b>/2 giọt</span>`);
  if(ST.step===5&&ST.N>=1.99)b.push(`<span class="sc">NaCl: <b>2</b> mL</span>`);
  if(ST.step>=1&&ST.step<=5&&ST.step!==3&&ST.step!==4)b.push(`<button class="btn" id="bsh" ${bz}>Lắc ống</button>`);
 }else{
  b.push(`<button class="btn pri" id="brx">${ST.rxPlay?'⏸ Dừng':(ST.rx>=1&&ST.rxDir>0?'▶ Chạy lại':'▶ Chạy phản ứng')}</button><button class="btn" id="brd" ${ST.rx<=0&&ST.rxDir<0?'':''}>${ST.rxDir>0?'⇄ Chiều nghịch (thuỷ phân)':'⇄ Chiều thuận (ester hoá)'}</button><button class="btn" id="brz">⟲ Về đầu</button><button class="btn ${ST.showH?'on':''}" id="bh">Ẩn / hiện H</button>`);
  if(ST.step>=8)b.push('<button class="btn pri" id="bgo">'+STEPS[8].btn+'</button>');
  b.push('<button class="btn" id="bbk">⬅ Về bàn thí nghiệm</button>');}
 b.push('<span class="sp"></span><span id="msgw" class="sc" style="max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title=""></span><button class="btn" id="bcam">Camera</button><button class="btn on" id="blab">Nhãn</button><button class="btn" id="brs">↺ Làm lại</button>');
 c.innerHTML=b.join('');
 const g=(id,f)=>{const el=$(id);if(el)el.onclick=f;};
 g('bgo',()=>{const a=nextAct();if(a&&!busy())a.fn();});
 g('bsh',shakeTube);g('bh',()=>{ST.showH=!ST.showH;renderCtrl();});
 g('brx',()=>{if(ST.rxPlay){ST.rxPlay=false;}else{if(ST.rxDir>0&&ST.rx>=1)ST.rx=0;if(ST.rxDir<0&&ST.rx<=0)ST.rx=1;ST.rxPlay=true;}renderCtrl();});
 g('brd',()=>{ST.rxDir=-ST.rxDir;ST.rxPlay=false;ST.msg=ST.rxDir<0?'Chiều nghịch: ester bị thuỷ phân trở lại thành axit và ancol.':'Chiều thuận: ester hoá.';renderCtrl();});
 g('brz',()=>{ST.rx=0;ST.rxPlay=false;ST.rxDir=1;renderCtrl();});
 g('bbk',()=>{ST.mol=false;ST.view=Math.min(ST.step,8);setView(0);renderLeft();renderCtrl();});
 g('bcam',()=>setView(ST.mol?1:0));g('blab',()=>{showL=!showL;$('blab').classList.toggle('on',showL);});
 g('brs',()=>{if(!confirm('Làm lại thí nghiệm? Điểm câu hỏi và nhiệm vụ đã làm được giữ.'))return;resetExp();});}
function qHTML(i){const q=QZ[i],a=QA[i];
 if(q.t==='tf'){const d=a.done;
  const head=`<div class="qh">Câu ${i+1} · 1 đ<span class="ty">Đúng / Sai (4 ý)</span>${d?' · '+fp(a.pts)+' đ':''}</div>`;
  let b=`<div class="qt">${q.q}</div>`+q.items.map((it,j)=>{const v=a.vals[j];const cls=d?(((v===1)===it.a)?' ok':' bad'):'';
   return`<div class="tfi${cls}"><div class="tft"><b>${'abcd'[j]})</b> ${it.t}</div><div class="tfb"><button class="${v===1?'sel':''}" data-q="${i}" data-j="${j}" data-v="1" ${d?'disabled':''}>Đúng</button><button class="${v===0?'sel':''}" data-q="${i}" data-j="${j}" data-v="0" ${d?'disabled':''}>Sai</button></div>${d?`<div class="ex ${cls.trim()==='ok'?'g':'r'}">${it.a?'Đúng':'Sai'} – ${it.x}</div>`:''}</div>`;}).join('');
  if(!d)b+=`<button class="btn pri tfc" data-chk="${i}" ${a.vals.some(v=>v<0)?'disabled':''}>Chấm điểm</button>`;
  return`<div class="q${d?(a.pts>=1?' okq':a.pts>0?'':' nq'):''}">${head}${b}</div>`;}
 const d=a.sel>=0;
 return`<div class="q${d?(a.sel===q.a?' okq':' nq'):''}"><div class="qh">Câu ${i+1} · 1 đ${d?' · '+(a.sel===q.a?'1':'0')+' đ':''}</div><div class="qt">${q.q}</div>`+q.o.map((o,k)=>`<button class="opt${d?(k===q.a?' ok':k===a.sel?' bad':''):''}" data-q="${i}" data-k="${k}" ${d?'disabled':''}>${'ABCD'[k]}. ${o}</button>`).join('')+(d?`<div class="ex ${a.sel===q.a?'g':'r'}">${a.sel===q.a?'✔ Chính xác. ':'✘ Chưa đúng. '}${q.x}</div>`:'')+'</div>';}
function ansTF(i){const a=QA[i],q=QZ[i];if(a.done||a.vals.some(v=>v<0))return;let n=0;q.items.forEach((it,j)=>{if((a.vals[j]===1)===it.a)n++;});a.pts=TFPTS[n];a.done=true;save();renderRight();}

function renderRight(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const rb=$('rb');
 if(tab==='tk'){rb.innerHTML=TASKS.map(t=>`<div class="tk${ST.tk[t.k]?' ok':''}"><i>${ST.tk[t.k]?'✓':''}</i><span>${t.t}</span></div>`).join('')+`<div class="hi">Nhiệm vụ tự đánh dấu khi bạn hoàn thành. Đã làm: <b>${Object.keys(ST.tk).length}/${TASKS.length}</b>.</div>`;}
 else if(tab==='qz'){const y=rb.scrollTop;rb.innerHTML=QZ.map((q,i)=>qHTML(i)).join('');rb.scrollTop=y;}
 else{const h=histGet();rb.innerHTML=`<div class="rs"><label>Họ tên học sinh</label><input id="stu2" value="${ST.stu.replace(/"/g,'&quot;')}" placeholder="Nhập họ tên"></div><pre id="rtx">${resText()}</pre><button class="btn pri" id="cp">Sao chép kết quả</button> <button class="btn" id="sv">Lưu vào lịch sử</button><div style="margin-top:10px;color:var(--mu)">Lịch sử trên trình duyệt này:</div>`+(h.length?h.slice().reverse().map(x=>`<div class="hi">${x}</div>`).join(''):'<div class="hi">Chưa có.</div>')+(h.length?'<button class="btn warn" id="hc" style="margin-top:6px">Xoá lịch sử</button>':'');
  const si=$('stu2');if(si)si.oninput=e=>{ST.stu=e.target.value;$('stu').value=ST.stu;save();$('rtx').textContent=resText();};
  const cp=$('cp');if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(resText());toast('Đã sao chép kết quả.');}catch(e){toast('Hãy chọn và sao chép thủ công.');}};
  const sv=$('sv');if(sv)sv.onclick=()=>{const h2=histGet();h2.push(new Date().toLocaleString('vi-VN')+' – '+(ST.stu||'(chưa nhập tên)')+': '+fp(score())+'/'+QZ.length+' điểm, '+Object.keys(ST.tk).length+'/'+TASKS.length+' nhiệm vụ');try{localStorage.setItem(HKEY,JSON.stringify(h2));}catch(e){}renderRight();toast('Đã lưu lịch sử.');};
  const hc=$('hc');if(hc)hc.onclick=()=>{try{localStorage.removeItem(HKEY);}catch(e){}renderRight();};}
 $('sc').textContent=fp(score());$('mx').textContent=QZ.length;}
function histGet(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){return[];}}
function resText(){let t='KẾT QUẢ: ĐIỀU CHẾ ETHYL ACETATE (ESTER HOÁ)\nHọc sinh: '+(ST.stu||'(chưa nhập)')+'\nNhiệm vụ: '+TASKS.filter(t=>ST.tk[t.k]).length+'/'+TASKS.length+'\nBước đã xong: '+ST.done.filter(Boolean).length+'/'+STEPS.length+'\n';
 QZ.forEach((q,i)=>{const a=QA[i];t+='Câu '+(i+1)+(q.t==='tf'?' (đúng/sai)':'')+': '+(q.t==='tf'?(a.done?fp(a.pts)+' đ':'chưa làm'):(a.sel<0?'chưa làm':a.sel===q.a?'đúng':'sai'))+'\n';});return t+'TỔNG ĐIỂM: '+fp(score())+'/'+QZ.length;}
function hud(){
 const m=$('msgw');if(m){m.textContent=ST.msg||'';m.title=ST.msg||'';m.style.display=ST.msg?'inline-block':'none';}
 const eb=$('eqb');if(ST.eq&&!ST.mol){eb.style.display='block';eb.textContent=ST.eq;}else eb.style.display='none';
 $('mc').style.display='none';const hm=ST.hT>0.05;$('ckw').style.display=hm&&!ST.mol?'inline-block':'none';$('ck').textContent=fp(Math.round(ST.hT*10)/10);}
let UI={l:true,i:true,r:true,col:false};
function applyUI(){
 $('lp').classList.toggle('hid',!UI.l);$('rp').classList.toggle('hid',!UI.r);$('info').classList.toggle('hid',!UI.i);$('info').classList.toggle('col',UI.col);
 $('hl').style.display=UI.l?'none':'block';$('hr').style.display=UI.r?'none':'block';
 $('tgl').classList.toggle('on',UI.l);$('tgr').classList.toggle('on',UI.r);$('tgi').classList.toggle('on',UI.i);$('ic').textContent=UI.col?'▸':'▾';
 const narrow=innerWidth<900;document.documentElement.style.setProperty('--lw',(UI.l&&!narrow?246:0)+'px');document.documentElement.style.setProperty('--rw',(UI.r&&!narrow?330:0)+'px');
 const any=UI.l||UI.r||UI.i;$('tga').classList.toggle('on',!any);$('tga').textContent=any?'⛶ Toàn cảnh':'⛶ Hiện lại';
 try{localStorage.setItem(UKEY,JSON.stringify(UI));}catch(e){}}
function init3D(){
 cvs=$('cv');R=new THREE.WebGLRenderer({canvas:cvs,antialias:true});R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 SC=new THREE.Scene();SC.background=new THREE.Color(0x0d1520);CAM=new THREE.PerspectiveCamera(40,1,.1,200);dummy=new THREE.Object3D();
 SC.add(new THREE.HemisphereLight(0xcfe4ff,0x1a2230,.95));const d1=new THREE.DirectionalLight(0xffffff,.85);d1.position.set(5,9,6);SC.add(d1);const d2=new THREE.DirectionalLight(0x9fc4ff,.35);d2.position.set(-6,4,-3);SC.add(d2);
 macro=buildMacro();mol=buildMol();mol.position.set(0,2.0,0);mol.visible=false;SC.add(macro);SC.add(mol);
 const pts=new Map();
 cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});});
 cvs.addEventListener('pointerup',e=>pts.delete(e.pointerId));cvs.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
 cvs.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;if(ST.mol){mol.rotation.y+=dx*.01;mol.rotation.x=clamp(mol.rotation.x+dy*.008,-1.2,1.2);}else{tg.th-=dx*.008;tg.ph=clamp(tg.ph-dy*.008,.25,1.55);}}
  else if(pts.size===2){const o=[...pts.entries()].find(([id])=>id!==e.pointerId)[1];const a0=Math.hypot(p.x-o.x,p.y-o.y),a1=Math.hypot(e.clientX-o.x,e.clientY-o.y);tg.r=clamp(tg.r*a0/Math.max(1,a1),4,26);}
  p.x=e.clientX;p.y=e.clientY;});
 cvs.addEventListener('wheel',e=>{e.preventDefault();tg.r=clamp(tg.r*(1+e.deltaY*.001),4,26);},{passive:false});
 setView(0);}
function frame(dt){
 macro.visible=!ST.mol;mol.visible=ST.mol;
 if(ST.mol)updMol(dt);else updMacro(dt);
 const L=macro.userData.labs;if(L)L.forEach(s=>{s.visible=showL;});thermLab.visible=showL;const SL=macro.userData.slab;if(SL)SL.forEach(s=>{s.visible=showL&&ST.sep>.8;});bottleL.forEach(s=>{s.visible=showL;});
 const k=1-Math.exp(-6*dt);for(const q of ['th','ph','r','tx','ty','tz'])cc[q]+=(tg[q]-cc[q])*k;
 const sp=Math.sin(cc.ph);CAM.position.set(cc.tx+cc.r*sp*Math.sin(cc.th),cc.ty+cc.r*Math.cos(cc.ph),cc.tz+cc.r*sp*Math.cos(cc.th));CAM.lookAt(cc.tx,cc.ty,cc.tz);
 const w=cvs.clientWidth,h=cvs.clientHeight;if(w&&h&&(cvs.width!==Math.floor(w*R.getPixelRatio())||cvs.height!==Math.floor(h*R.getPixelRatio()))){R.setSize(w,h,false);CAM.aspect=w/h;CAM.updateProjectionMatrix();}
 R.render(SC,CAM);}
let last=0,lastHud=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||.016);last=now;tm+=dt;
 if(HAS3D){try{frame(dt);}catch(e){console.error(e);HAS3D=false;$('nogl').hidden=false;$('nogl').textContent='Lỗi hiển thị 3D: '+e.message;}}
 if(now-lastHud>150){lastHud=now;hud();}}
function initUI(){load();$('stu').value=ST.stu;$('stu').oninput=e=>{ST.stu=e.target.value;save();if(tab==='rs'&&$('stu2')){$('stu2').value=ST.stu;$('rtx').textContent=resText();}};
 renderLeft();renderCtrl();renderRight();
 $('stl').onclick=e=>{const s=e.target.closest('.stp');if(s)goView(+s.dataset.i);};
 document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;renderRight();};
 $('rb').onclick=e=>{const o=e.target.closest('.opt');if(o){if(o.disabled)return;QA[+o.dataset.q].sel=+o.dataset.k;save();renderRight();return;}
  const t=e.target.closest('.tfb button');if(t){if(t.disabled)return;QA[+t.dataset.q].vals[+t.dataset.j]=+t.dataset.v;renderRight();return;}
  const c=e.target.closest('.tfc');if(c&&!c.disabled)ansTF(+c.dataset.chk);};
 try{const u=JSON.parse(localStorage.getItem(UKEY)||'null');if(u)Object.assign(UI,u);}catch(e){}
 let saved=null;
 $('tl').onclick=()=>{UI.l=false;applyUI();};$('hl').onclick=()=>{UI.l=true;applyUI();};$('tgl').onclick=()=>{UI.l=!UI.l;applyUI();};
 $('tr').onclick=()=>{UI.r=false;applyUI();};$('hr').onclick=()=>{UI.r=true;applyUI();};$('tgr').onclick=()=>{UI.r=!UI.r;applyUI();};
 $('tgi').onclick=()=>{UI.i=!UI.i;if(UI.i)UI.col=false;applyUI();};$('ix').onclick=()=>{UI.i=false;applyUI();};$('ic').onclick=()=>{UI.col=!UI.col;applyUI();};
 $('tga').onclick=()=>{const any=UI.l||UI.r||UI.i;if(any){saved={l:UI.l,r:UI.r,i:UI.i};UI.l=UI.r=UI.i=false;}else{const sv=saved||{l:true,r:true,i:true};UI.l=sv.l;UI.r=sv.r;UI.i=sv.i;if(!(UI.l||UI.r||UI.i))UI.l=UI.r=UI.i=true;}applyUI();};
 addEventListener('resize',applyUI);applyUI();}
function boot(){if(booted)return;booted=true;HAS3D=(typeof THREE!=='undefined');
 if(HAS3D){try{init3D();}catch(e){console.error(e);HAS3D=false;}}
 if(!HAS3D){$('nogl').hidden=false;$('nogl').textContent='Không tải được Three.js hoặc WebGL (cần Internet). Phần bước, nhiệm vụ và câu hỏi vẫn dùng được.';}
 initUI();requestAnimationFrame(loop);}
window.addEventListener('load',()=>setTimeout(boot,50));
